<svg viewBox="0 0 760 700" width="760" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,'SF Mono','Cascadia Code','Consolas',monospace">

  <defs>
    <marker id="a-amber" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#d97706"/></marker>
    <marker id="a-green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#16a34a"/></marker>
    <marker id="a-red"   markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#dc2626"/></marker>
    <marker id="a-blue"  markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#2563eb"/></marker>
    <marker id="a-dim"   markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#94a3b8"/></marker>
  </defs>

  <!-- Page background -->
  <rect width="760" height="700" fill="#f8fafc" rx="12"/>

  <!-- ── ZONE BANDS ─────────────────────────────────────────────── -->

  <!-- Zone 1: Ingestion -->
  <rect x="14" y="14" width="732" height="300" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="28" y="33" font-size="9" letter-spacing="2" fill="#94a3b8" text-transform="uppercase">INGESTION</text>

  <!-- Zone 2: Moderation -->
  <rect x="14" y="326" width="732" height="192" rx="10" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <text x="28" y="344" font-size="9" letter-spacing="2" fill="#b45309">MODERATION</text>

  <!-- Zone 3: Public -->
  <rect x="14" y="530" width="732" height="158" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="28" y="548" font-size="9" letter-spacing="2" fill="#15803d">PUBLIC LAYER</text>

  <!-- ══════════════════════════════════════════════
       MAIN FLOW — centre column (cx=380)
       Box: w=180 h=42 → x=290
  ══════════════════════════════════════════════ -->

  <!-- 1. User submits URL -->
  <rect x="290" y="44" width="180" height="42" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="63" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">User submits URL</text>
  <text x="380" y="78" font-size="9" fill="#94a3b8" text-anchor="middle">paste · browser extension</text>

  <!-- arrow down -->
  <line x1="380" y1="86" x2="380" y2="106" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-amber)"/>

  <!-- 2. Cache Layer -->
  <rect x="290" y="114" width="180" height="42" rx="8" fill="white" stroke="#d97706" stroke-width="1.5"/>
  <text x="380" y="133" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Cache Layer</text>
  <text x="380" y="148" font-size="9" fill="#94a3b8" text-anchor="middle">memory → database lookup</text>

  <!-- HIT branch right -->
  <path d="M470,135 L530,135" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/>
  <text x="500" y="129" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="700">HIT</text>
  <rect x="530" y="114" width="170" height="42" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="615" y="133" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Result returned</text>
  <text x="615" y="148" font-size="9" fill="#16a34a" text-anchor="middle">~0 ms · free · no API call</text>

  <!-- MISS arrow down -->
  <line x1="380" y1="156" x2="380" y2="176" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-amber)"/>
  <text x="392" y="170" font-size="9" fill="#94a3b8">MISS</text>

  <!-- 3. Rate Limiter -->
  <rect x="290" y="184" width="180" height="42" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="380" y="203" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Rate Limiter</text>
  <text x="380" y="218" font-size="9" fill="#94a3b8" text-anchor="middle">5 / IP / day · 100 global / day</text>

  <!-- BLOCKED branch right -->
  <path d="M470,205 L530,205" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a-red)"/>
  <text x="500" y="199" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">BLOCKED</text>
  <rect x="530" y="184" width="170" height="42" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="615" y="203" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">429 — Too Many</text>
  <text x="615" y="218" font-size="9" fill="#dc2626" text-anchor="middle">self-host for unlimited access</text>

  <!-- PASS arrow down -->
  <line x1="380" y1="226" x2="380" y2="246" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-amber)"/>
  <text x="392" y="240" font-size="9" fill="#94a3b8">PASS</text>

  <!-- 4. Claude Sonnet -->
  <rect x="290" y="254" width="180" height="42" rx="8" fill="white" stroke="#d97706" stroke-width="1.5"/>
  <text x="380" y="273" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Claude Sonnet</text>
  <text x="380" y="288" font-size="9" fill="#94a3b8" text-anchor="middle">5 dimensions scored · ~$0.01</text>

  <!-- arrow to pending -->
  <line x1="380" y1="296" x2="380" y2="336" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-amber)"/>

  <!-- ══ MODERATION ZONE ══════════════════════════════════════ -->

  <!-- 5. DB · pending -->
  <rect x="290" y="344" width="180" height="42" rx="8" fill="white" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="380" y="363" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">DB · status = pending</text>
  <text x="380" y="378" font-size="9" fill="#94a3b8" text-anchor="middle">outlet · region · score stored</text>

  <!-- Admin UI branch -->
  <path d="M470,365 C510,365 510,405 530,405" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a-blue)" fill="none"/>
  <text x="508" y="382" font-size="9" fill="#2563eb" text-anchor="middle">reviews via</text>
  <rect x="530" y="384" width="170" height="42" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="615" y="403" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">/admin</text>
  <text x="615" y="418" font-size="9" fill="#2563eb" text-anchor="middle">Bearer token · outlet · region tag</text>

  <!-- arrow pending → moderation -->
  <line x1="380" y1="386" x2="380" y2="416" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-amber)"/>

  <!-- 6. Moderation Queue -->
  <rect x="290" y="424" width="180" height="42" rx="8" fill="white" stroke="#b45309" stroke-width="1.5"/>
  <text x="380" y="443" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Moderation Queue</text>
  <text x="380" y="458" font-size="9" fill="#94a3b8" text-anchor="middle">scope · plausibility · outlet canonical</text>

  <!-- APPROVED fork left-down -->
  <path d="M340,466 L280,560" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)" fill="none"/>
  <text x="285" y="517" font-size="9" fill="#16a34a" font-weight="700" text-anchor="middle">APPROVED</text>

  <!-- REJECTED fork right-down -->
  <path d="M420,466 L478,560" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a-red)" fill="none"/>
  <text x="478" y="517" font-size="9" fill="#dc2626" font-weight="700" text-anchor="middle">REJECTED</text>

  <!-- ══ PUBLIC ZONE ═══════════════════════════════════════════ -->

  <!-- Seed Layer (left, merges into approved) -->
  <rect x="14" y="556" width="164" height="42" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="96" y="575" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">pramaana_data.py</text>
  <text x="96" y="590" font-size="9" fill="#94a3b8" text-anchor="middle">seed · auto-approved</text>
  <path d="M178,577 L210,577" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)" fill="none"/>

  <!-- 7. DB · approved -->
  <rect x="210" y="556" width="180" height="42" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="300" y="575" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">DB · status = approved</text>
  <text x="300" y="590" font-size="9" fill="#16a34a" text-anchor="middle">canonical outlet · region · score</text>

  <!-- Rejected end node -->
  <rect x="414" y="556" width="140" height="42" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="1" opacity="0.7"/>
  <text x="484" y="575" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">Discarded</text>
  <text x="484" y="590" font-size="9" fill="#dc2626" text-anchor="middle">not visible publicly</text>

  <!-- Arrows to outputs -->
  <line x1="256" y1="598" x2="200" y2="638" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/>
  <line x1="340" y1="598" x2="390" y2="638" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/>

  <!-- 8. Leaderboard -->
  <rect x="120" y="646" width="168" height="38" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="204" y="665" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Outlet Leaderboard</text>
  <text x="204" y="678" font-size="9" fill="#16a34a" text-anchor="middle">live · grows with approvals</text>

  <!-- 9. Dataset export -->
  <rect x="336" y="646" width="168" height="38" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="420" y="665" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">dataset/articles.json</text>
  <text x="420" y="678" font-size="9" fill="#94a3b8" text-anchor="middle">portable · citable · forkable</text>

</svg>
